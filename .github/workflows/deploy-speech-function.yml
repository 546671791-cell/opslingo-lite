name: Deploy Azure Speech Proxy
on:
  workflow_dispatch:
    inputs:
      function_app_name:
        description: Azure Function App name
        required: true
        type: string
permissions: { contents: read }
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: '20',
            cache: npm,
            cache-dependency-path: azure-function/package-lock.json
          }
      - run: npm ci
        working-directory: azure-function
      - run: npm run build
        working-directory: azure-function
      - uses: Azure/functions-action@v1
        with:
          app-name: ${{ inputs.function_app_name }}
          package: azure-function
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
